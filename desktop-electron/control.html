<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Vault</title>
  <style>
    :root { color-scheme: dark; --bg:#0c0d0c; --card:#151715; --line:#292d29; --text:#f5f7f5; --muted:#949a94; --green:#70d69d; --green2:#4db87b; --danger:#ff7c7c; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 16%, #17241c 0, var(--bg) 34rem); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; }
    main { width:min(620px,calc(100vw - 40px)); padding:42px; border:1px solid var(--line); border-radius:22px; background:rgba(21,23,21,.94); box-shadow:0 30px 90px rgba(0,0,0,.45); }
    .mark { width:48px; height:48px; display:grid; place-items:center; border-radius:15px; margin-bottom:28px; background:#1e3527; color:var(--green); font-size:30px; font-weight:700; }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0; font-size:34px; letter-spacing:-.035em; }
    .lead { margin:14px 0 26px; max-width:48ch; color:var(--muted); line-height:1.55; }
    .status { display:grid; grid-template-columns:1fr auto; gap:10px 18px; margin:0 0 26px; padding:18px; border:1px solid var(--line); border-radius:14px; background:#101210; font-size:14px; }
    .status span { color:var(--muted); }
    .status strong { text-align:right; font-weight:600; }
    .path { grid-column:1 / -1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#c4c9c4; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; }
    button { min-height:44px; padding:0 18px; border-radius:11px; border:1px solid var(--line); background:#1b1e1b; color:var(--text); font:inherit; font-weight:650; cursor:pointer; }
    button:hover { background:#242824; }
    button.primary { border-color:transparent; background:var(--green); color:#102017; }
    button.primary:hover { background:var(--green2); }
    button:disabled { opacity:.55; cursor:wait; }
    .error { margin:18px 0 0; padding:13px 15px; border:1px solid rgba(255,124,124,.28); border-radius:11px; background:rgba(255,124,124,.08); color:var(--danger); font-size:13px; line-height:1.45; }
    .note { margin:18px 0 0; color:var(--muted); font-size:12px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <p class="eyebrow">Your private content library</p>
    <h1 id="title">Opening Canvas Vault</h1>
    <p class="lead" id="lead">Preparing your library and Canvas Workspace. Everything stays on this Mac.</p>
    <section class="status" aria-live="polite">
      <span>Status</span><strong id="state">Closed</strong>
      <span>Runtime</span><strong id="phase">Not running</strong>
      <span>Database</span><strong id="database">Stopped</strong>
      <div class="path" id="workspacePath"></div>
    </section>
    <div class="actions">
      <button class="primary" id="start">Open Canvas Vault</button>
      <button id="stop" hidden>Stop Canvas Vault</button>
      <button id="workspace">Open Canvas Workspace</button>
      <button id="chooseWorkspace">Choose workspace folder</button>
      <button id="data">Private data</button>
      <button id="logs">Open logs</button>
    </div>
    <p class="error" id="error" hidden></p>
    <p class="note">Private to this Mac · 127.0.0.1:3217</p>
  </main>
  <script>
    const bridge = window.canvasV4Desktop;
    const nodes = Object.fromEntries(["title","lead","state","phase","database","workspacePath","start","stop","workspace","chooseWorkspace","data","logs","error"].map((id) => [id, document.getElementById(id)]));
    let timer;

    function humanState(value) { return value ? value[0].toUpperCase() + value.slice(1) : "Closed"; }
    function render(status) {
      const state = status?.state || "closed";
      nodes.state.textContent = humanState(state);
      nodes.phase.textContent = status?.startupPhase || (state === "closed" ? "Not running" : "Ready");
      nodes.database.textContent = humanState(status?.databaseStatus || "stopped");
      nodes.workspacePath.textContent = status?.workspacePath || "";
      nodes.error.hidden = !status?.error;
      nodes.error.textContent = status?.error || "";
      nodes.start.disabled = state === "starting";
      nodes.start.textContent = state === "starting" ? "Opening…" : state === "external" ? "Open Canvas Vault" : "Start Canvas Vault";
      nodes.stop.hidden = state !== "open";
      if (state === "starting") {
        nodes.title.textContent = "Opening Canvas Vault";
        nodes.lead.textContent = "Preparing your local library. This can take a few seconds.";
      } else if (state === "external") {
        nodes.title.textContent = "Canvas Vault is already running";
        nodes.lead.textContent = "The existing local Canvas Vault runtime will be reused safely.";
      } else if (state === "error") {
        nodes.title.textContent = "Canvas Vault needs attention";
        nodes.lead.textContent = "The local runtime could not start. The message below explains what to repair.";
      } else if (state === "open") {
        nodes.title.textContent = "Canvas Vault is ready";
        nodes.lead.textContent = "Your library and Canvas Workspace are ready to use.";
      } else {
        nodes.title.textContent = "Canvas Vault is closed";
        nodes.lead.textContent = "Open the app when you want to use your local content library.";
      }
    }

    async function refresh() {
      try { render(await bridge.getRuntimeStatus()); }
      catch (error) { render({ state:"error", error:error.message }); }
    }

    nodes.start.addEventListener("click", async () => {
      nodes.start.disabled = true;
      timer = setInterval(refresh, 350);
      try { render(await bridge.start()); }
      catch (error) { render({ state:"error", error:error.message }); }
      finally { clearInterval(timer); nodes.start.disabled = false; }
    });
    nodes.stop.addEventListener("click", async () => render(await bridge.stop()));
    nodes.workspace.addEventListener("click", () => bridge.openWorkspace());
    nodes.chooseWorkspace.addEventListener("click", async () => render(await bridge.chooseWorkspace()));
    nodes.data.addEventListener("click", () => bridge.revealPrivateData());
    nodes.logs.addEventListener("click", () => bridge.revealLogs());
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
